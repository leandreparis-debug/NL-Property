[project]
name = "news-property"
version = "0.1.0"
description = "Préparation de la newsletter interne mensuelle de Carrefour Property (immobilier logistique)."
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
