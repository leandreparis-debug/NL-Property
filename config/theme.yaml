# Thème de la newsletter : tout ce qui relève de la charte graphique est ici, et seulement ici.
#
# La mise en page reprend la structure de la charte de référence (bandeau de couleur avec
# logo en réserve blanche et motif de formes, rubriques numérotées dans une arche, encadrés
# clairs, logo couleurs en bas et centré). Les couleurs sont celles du logo Carrefour
# Property : le violet #8D2562 est la couleur exacte du logo (bandeau, titres, Une), avec
# un ton plus foncé pour les titres et des gris neutres pour le texte. Les rubriques
# reçoivent chacune une couleur d'accent de la palette « violet et terre » (terracotta,
# bleu canard, ocre, olive, taupe), sur des encadrés crème. Mode d'emploi : docs/theme.md.
# Après modification, ouvrez l'écran « Thème » de l'application : il vérifie le fichier et
# les contrastes.
#
# Règles : couleurs au format #RRGGBB ; polices système uniquement (pas de police en ligne :
# Gmail et l'impression doivent rendre la même chose sur tous les postes) ; chemins de
# fichiers relatifs au dossier du projet.

# Nom affiché dans le bandeau d'en-tête.
name: News Property

# Phrase sous le bandeau.
tagline: La newsletter mensuelle de l'équipe entrepôts de Carrefour Property

colors:
  # Violet du logo Carrefour Property : bandeau d'en-tête, filets, grands éléments.
  # Blanc sur ce violet = 8,2:1, utilisable aussi pour du petit texte.
  primary: "#8D2562"
  # Violet foncé (ton sombre du logo) : titres, liens, chiffres de la Une.
  secondary: "#5E1741"
  # Gris foncé neutre : texte courant.
  text: "#3F3F3F"
  # Gris moyen : sources, dates, légendes (reste lisible sur blanc et sur les encadrés).
  muted: "#666666"
  # Fond : reste blanc (impression et e-mail).
  background: "#FFFFFF"
  # Crème : encadrés (Une, sommaire, calendrier...).
  surface: "#F7F2EC"
  # Séparateurs fins (sable).
  border: "#E3D8CC"
  # Badge « Transaction » (article qui annonce une transaction) : sable clair, texte brun.
  highlight: "#F6E2C8"
  highlight_text: "#7A3A12"

# Couleur d'accent de chaque rubrique (formes, numéros, filets), palette « violet et
# terre ». Le numéro est écrit en blanc ou en violet foncé, selon ce qui contraste le mieux.
section_colors:
  une: "#8D2562"        # violet du logo
  rubrique_1: "#C65A2E" # terracotta : actualités de l'immobilier logistique
  rubrique_2: "#2E6E7E" # bleu canard : acteurs du marché
  rubrique_3: "#B8860B" # ocre doré : réglementation
  rubrique_4: "#8D2562" # violet du logo : visites d'entrepôts
  rubrique_5: "#6B8E23" # olive : calendrier
  rubrique_6: "#8C6D5B" # taupe : congés et absences
  rubrique_7: "#5E1741" # violet foncé : documents utiles

fonts:
  # Polices système uniquement : Century Gothic (installée avec Office), puis équivalents.
  body: "'Century Gothic', 'URW Gothic', 'Avant Garde', 'Trebuchet MS', Arial, sans-serif"
  headings: "'Century Gothic', 'URW Gothic', 'Avant Garde', 'Trebuchet MS', Arial, sans-serif"
  # Police condensée pour les encadrés et les chiffres : Bahnschrift Condensed (Windows 10
  # et 11), puis Arial Narrow.
  labels: "'Bahnschrift Condensed', Bahnschrift, 'Arial Narrow', 'Nimbus Sans Narrow', sans-serif"

# Logo Carrefour Property (PNG, relatif au dossier du projet).
# Version couleurs (violet) pour fond blanc (pied de page) ...
logo: config/assets/logo-carrefour-property.png
# ... et version en réserve blanche, uniquement sur le violet du bandeau.
logo_reverse: config/assets/logo-carrefour-property-blanc.png
# Texte alternatif des logos (lu à la place de l'image si elle ne s'affiche pas).
logo_alt: Carrefour Property

# Texte du pied de page.
footer_text: "Newsletter interne Carrefour Property - diffusion réservée aux équipes Carrefour Property."

# Titres des rubriques, modifiables.
section_titles:
  une: "À la une ce mois-ci"
  rubrique_1: "Actualités de l'immobilier logistique"
  rubrique_2: "Les acteurs du marché"
  rubrique_3: "Réglementation"
  rubrique_4: "Nos visites d'entrepôts"
  rubrique_5: "Calendrier à venir"
  rubrique_6: "Congés et absences de l'équipe"
  rubrique_7: "Documents utiles"
