# Référentiel des acteurs de l'immobilier logistique suivis par News Property.
#
# Chargé et synchronisé en base à chaque démarrage de l'application :
# - un acteur ajouté ici est créé ;
# - la catégorie et les alias sont mis à jour ;
# - un acteur retiré n'est jamais effacé : il n'est simplement plus suivi.
#
# Un article de veille qui cite un acteur (nom ou alias) est classé en rubrique 2
# « Les acteurs du marché » ; Google Actualités est interrogé pour chacun.
#
# Champs : name (obligatoire, unique), category (texte libre, ex. « Investisseur et
# développeur »), aliases (autres écritures du nom, utilisées pour repérer l'acteur dans les
# articles), case_sensitive (facultatif, false par défaut ; true exige la majuscule initiale
# lors de la détection, pour les noms qui sont aussi des mots courants ou des sigles courts).
# Un nom ou un alias ne peut désigner qu'un seul acteur (la casse, les accents et le type
# d'apostrophe ne comptent pas pour cette vérification).
#
# LISTE À VÉRIFIER par l'utilisateur : elle a été constituée sans liste fournie, à partir
# des acteurs connus du marché français. Ajoutez vos interlocuteurs, retirez les inutiles.
# Modifiez ce fichier avec le Bloc-notes (2 espaces d'indentation, pas de tabulation).

